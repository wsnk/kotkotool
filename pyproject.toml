[project]
name = "kotkotool"
version = "0.1.0"
description = "Infrastructure utilities for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomli_w"
]

[dependency-groups]
dev = [
  "pytest >=8.4",
  "pytest-asyncio",
  "ruff >=0.15"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kotkotool"]

[tool.pytest]
asyncio_mode = "auto"